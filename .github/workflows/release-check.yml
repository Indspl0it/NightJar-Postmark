name: Release check

# Builds the unsigned release APK of each version tag from scratch. The maintainer signs the release offline; this
# build is the independent copy to compare with the signed APK before it is published (see the release docs).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default list includes the old "tools" package, which current sdkmanager versions no longer have.
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Build the unsigned release APK
        run: ./gradlew :app:assembleRelease --no-build-cache --no-configuration-cache

      - name: Write the checksum
        run: |
          cd app/build/outputs/apk/release
          sha256sum *-release-unsigned.apk | tee SHA256SUMS-unsigned
          {
            echo "### Unsigned release APK"
            echo '```'
            cat SHA256SUMS-unsigned
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightjar-release-unsigned
          path: |
            app/build/outputs/apk/release/*-release-unsigned.apk
            app/build/outputs/apk/release/SHA256SUMS-unsigned
          if-no-files-found: error
