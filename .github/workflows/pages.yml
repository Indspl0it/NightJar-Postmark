name: Website

# Builds the documentation website in website/. A push to main publishes it to GitHub Pages.
# A pull request only builds it, so that broken links and diagram errors stop the merge.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  D2_VERSION: v0.9.0
  # SHA-256 of d2-v0.9.0-linux-amd64.tar.gz, from the SHA256SUMS file of the D2 release.
  D2_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The diagrams are D2 code blocks. astro-d2 calls the d2 binary during the build.
      - name: Install D2
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o d2.tar.gz "https://github.com/d2lang/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz"
          echo "${D2_SHA256}  d2.tar.gz" | sha256sum --check
          tar -xzf d2.tar.gz
          echo "${{ runner.temp }}/d2-${D2_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Build the website
        run: npm run build

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
