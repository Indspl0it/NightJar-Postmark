# Pinned versions. Chosen 2026-11-05 as latest stable. Upgrades are separate tasks.
[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.14"
composeBom = "2026.09.00"
material3 = "1.4.0"
material3Adaptive = "1.3.0"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
room = "2.8.5"
sqlcipher = "4.20.0"
sqlite = "2.7.1"
datastore = "1.3.0"
work = "2.12.0"
paging = "3.5.3"
navigation = "2.10.2"
biometric = "1.1.0"
activity = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
serialization = "1.12.0"
coroutines = "1.11.0"
junit5 = "6.1.3"
junit4 = "4.13.2"
robolectric = "4.17"
# JVM screenshot tests. 1.77.0 is the plugin version already in the Gradle cache.
roborazzi = "1.77.0"
